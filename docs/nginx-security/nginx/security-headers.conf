# Security headers for everything nginx serves itself: the SPA, its assets
# and static files. nginx drops server-level `add_header` directives in any
# location that declares its own, so this file is included in every such
# location. Proxied API responses carry the API's own security headers.

add_header X-Frame-Options SAMEORIGIN always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), payment=(self \"https://buy.paddle.com\" \"https://sandbox-buy.paddle.com\"), usb=(), serial=(), bluetooth=()" always;
add_header X-Robots-Tag $robots_tag always;

# Enforced: the directives no source list can break.
add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

# The full policy, report-only while violation reports are reviewed.
# `wasm-unsafe-eval` is needed by the WebAssembly document and image codecs;
# `style-src 'unsafe-inline'` by the CSS-in-JS runtime. `__CSP_REPORT__` is
# replaced at image build time with the report endpoint, or removed.
add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' https://accounts.google.com; script-src 'self' 'wasm-unsafe-eval' https://cdn.paddle.com https://eu-assets.i.posthog.com https://us-assets.i.posthog.com https://www.clarity.ms https://*.clarity.ms; style-src 'self' 'unsafe-inline' https://cdn.paddle.com; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' data: blob: https://*.r2.cloudflarestorage.com https://eu.i.posthog.com https://us.i.posthog.com https://eu-assets.i.posthog.com https://us-assets.i.posthog.com https://*.clarity.ms https://*.ingest.sentry.io https://*.ingest.de.sentry.io https://*.ingest.us.sentry.io https://*.neon.tech https://api.coingecko.com https://*.paddle.com; frame-src 'self' https:; worker-src 'self' blob:; manifest-src 'self'; __CSP_REPORT__" always;
