# `Upgrade` and `Connection` are hop-by-hop headers and must be forwarded
# explicitly for WebSocket upgrades. Plain requests get an empty value.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Only the public marketing pages are indexed. The SPA serves one
# index.html for every path, so indexing is controlled by a header.
map $request_uri $robots_tag {
    default "noindex, nofollow";
    ~^/(about|pricing|design|terms|privacy|cookies|subprocessors|refunds|acceptable-use|dpa|security)?/?(\?.*)?$ "";
    ~^/(robots\.txt|sitemap\.xml)$ "";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://server:3001;

    # API: unbuffered so streamed progress reaches the browser as it is sent;
    # long timeouts for AI generation and large exports.
    location /api/ {
        proxy_pass $api$request_uri;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_pass_header X-Accel-Buffering;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Real-time collaboration socket: kept open through long idle reading.
    location ~ ^/api/pages/[^/]+/ydoc$ {
        proxy_pass $api$request_uri;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /neon-auth/ {
        proxy_pass $api$request_uri;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_read_timeout 60s;
    }

    # Source maps are never served.
    location ~* \.map$ {
        return 404;
    }

    # Content-hashed assets: cached for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    # The app shell and service worker files: always revalidated.
    location ~* ^/(index\.html|sw\.js|sw-legacy-upgrade\.js|registerSW\.js|manifest\.json|workbox-[^/]+\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location ~ ^/how-its-built/?$ {
        return 301 /security$is_args$args;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ @spa;
    }

    location @spa {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /index.html =404;
    }
}
